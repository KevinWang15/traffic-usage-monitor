name: traffic-usage-monitor-container-test

x-mock: &mock
  image: node:22-slim
  command: ["node", "/fixtures/mock.mjs"]
  volumes:
    - ./:/fixtures:ro
  networks: [test]
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:8080/__admin/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  mysql:
    image: mysql:8.4
    # Avoid exhausting the shared host's native AIO slots.
    command: ["--innodb-use-native-aio=0"]
    environment:
      MYSQL_ROOT_PASSWORD: container-root-only
      MYSQL_DATABASE: traffic_notifications
      MYSQL_USER: monitor
      MYSQL_PASSWORD: container-db-only
    volumes:
      - database:/var/lib/mysql
    networks: [test]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u monitor -D traffic_notifications -e 'SELECT 1'",
        ]
      interval: 2s
      timeout: 3s
      retries: 60

  certificates:
    image: traffic-usage-monitor-container-test:local
    entrypoint: ["sh", "/fixtures/certificates.sh"]
    volumes:
      - ./:/fixtures:ro
      - certificates:/certificates
    networks: [test]

  email:
    <<: *mock
    environment:
      MOCK_KIND: email
    volumes:
      - ./:/fixtures:ro
      - certificates:/certificates:ro
    depends_on:
      certificates:
        condition: service_completed_successfully
    networks:
      test:
        aliases: [email.api.engagelab.cc]

  webhook:
    <<: *mock
    environment:
      MOCK_KIND: webhook

  app:
    image: traffic-usage-monitor-container-test:local
    build:
      context: ../..
      dockerfile: k3s/Dockerfile.multistage
    command: ["sh", "-c", "npx prisma migrate deploy && exec node dist/server.js"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: UTC
      PUBLIC_URL: "http://localhost:${CONTAINER_TEST_APP_PORT:-24870}"
      DATABASE_URL: mysql://monitor:container-db-only@mysql:3306/traffic_notifications
      JWT_SECRET: container-notification-test-only
      ENGAGE_LAB_USERNAME: container-email-user
      ENGAGE_LAB_API_KEY: container-email-key
      ENGAGE_LAB_FROM_EMAIL: noreply@example.test
      NODE_EXTRA_CA_CERTS: /certificates/ca.pem
      # The integration runner triggers the missing-node sweep explicitly.
      MISSING_NODE_GRACE_MINUTES: "1000000"
      WEBHOOK_ALLOW_PRIVATE_IPS: "true"
    volumes:
      - certificates:/certificates:ro
    depends_on:
      mysql:
        condition: service_healthy
      email:
        condition: service_healthy
      webhook:
        condition: service_healthy
    networks: [test]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      start_period: 20s
      retries: 60

  gateway:
    image: node:22-slim
    command: ["node", "/fixtures/gateway.mjs"]
    volumes:
      - ./:/fixtures:ro
    ports:
      - "127.0.0.1:${CONTAINER_TEST_APP_PORT:-24870}:3000"
      - "127.0.0.1:${CONTAINER_TEST_WEBHOOK_PORT:-24871}:8081"
      - "127.0.0.1:${CONTAINER_TEST_EMAIL_PORT:-24872}:8082"
    depends_on:
      app:
        condition: service_healthy
    networks: [test, inspection]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    image: traffic-usage-monitor-container-checks:local
    build:
      context: ../..
      dockerfile: k3s/Dockerfile.multistage
      target: builder
    profiles: [test]
    working_dir: /app/server
    command: ["sh", "-c", "npm test && npm run typecheck && node --test -r ts-node/register -r tsconfig-paths/register tests/notifications.integration.ts"]
    environment:
      APP_URL: http://app:3000
      EMAIL_URL: http://email:8080
      WEBHOOK_URL: http://webhook:8080
      PUBLIC_URL: "http://localhost:${CONTAINER_TEST_APP_PORT:-24870}"
      NODE_ENV: production
      DATABASE_URL: mysql://monitor:container-db-only@mysql:3306/traffic_notifications
      JWT_SECRET: container-notification-test-only
      ENGAGE_LAB_USERNAME: container-email-user
      ENGAGE_LAB_API_KEY: container-email-key
      ENGAGE_LAB_FROM_EMAIL: noreply@example.test
      NODE_EXTRA_CA_CERTS: /certificates/ca.pem
      WEBHOOK_ALLOW_PRIVATE_IPS: "true"
      MISSING_NODE_GRACE_MINUTES: "60"
    volumes:
      - certificates:/certificates:ro
      - ./artifacts:/artifacts
      - ../../server/tests:/app/server/tests:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [test]

networks:
  test:
    internal: true
  inspection:

volumes:
  database:
  certificates:
