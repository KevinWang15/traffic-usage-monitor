apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-usage-monitor
  namespace: traffic-usage-monitor
  labels:
    app.kubernetes.io/name: traffic-usage-monitor
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-usage-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-usage-monitor
    spec:
      initContainers:
        - name: prisma-migrate
          image: ghcr.io/your-org/traffic-usage-monitor:latest
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: traffic-usage-monitor-secret
      containers:
        - name: traffic-usage-monitor
          image: ghcr.io/your-org/traffic-usage-monitor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: traffic-usage-monitor-secret
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
