apiVersion: v1
kind: Secret
metadata:
  name: traffic-usage-monitor-secret
  namespace: traffic-usage-monitor
type: Opaque
stringData:
  PUBLIC_URL: "https://traffic-usage-monitor.example.com"
  APP_VERSION: "0.1.0"
  NODE_ENV: "production"
  PORT: "3000"
  JWT_SECRET: "replace-with-a-long-random-secret"
  DATABASE_URL: "mysql://traffic_usage_monitor:replace-with-a-strong-app-password@traffic-usage-monitor-mysql:3306/traffic_usage_monitor"
  TZ: "UTC"
  ENGAGE_LAB_USERNAME: ""
  ENGAGE_LAB_API_KEY: ""
  ENGAGE_LAB_FROM_EMAIL: ""
  HEALTHCHECKS_PING_URL: ""
  EMAIL_VERIFICATION_TOKEN_TTL_MINUTES: "1440"
  PASSWORD_RESET_TOKEN_TTL_MINUTES: "60"
